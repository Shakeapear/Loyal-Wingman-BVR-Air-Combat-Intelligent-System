name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: |
          python -m pip install -r 多任务智能体/requirements-server.txt
          python -m pip install -e 多任务智能体 --no-deps
      - name: Preflight (includes JSBSim reset/step smoke)
        run: python -X utf8 多任务智能体/validation/preflight_server.py --run-smoke
      - name: Full test suites
        run: |
          python -m pytest "多任务智能体/tests" "引导策略行为树/tests" "可视化工具/tests" -q
